name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

jobs:
  # These steps are `make check` split up so a failure names itself in the UI. Keep the two
  # in step: `make check` runs lint, format check, typecheck, links, test — in that order.
  check:
    name: lint · format · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint (Ruff)
        run: uv run ruff check src tests scripts

      - name: Format check (Ruff)
        run: uv run ruff format --check src tests scripts

      - name: Type check (BasedPyright)
        run: uv run basedpyright

      # Relative Markdown links and heading anchors. Cheap, and it fails on the class of
      # defect that three review rounds found by reading citations by hand.
      - name: Check documentation links
        run: uv run python scripts/check_links.py

      - name: Test with coverage
        run: uv run pytest --cov=tradipy --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
