name: Release

# Manual, tag-driven build. Publishing to an index is intentionally left as a
# commented step — wire it up when the package is meant to be distributed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.13
        run: uv python install 3.13

      # A tag that disagrees with pyproject.toml publishes a version nobody can reproduce
      # from the source tree, so refuse it here rather than after the artifacts exist.
      - name: Verify tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          project_version="$(uv version --short)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$project_version" != "$tag_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $project_version"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches version $project_version"

      - name: Build sdist and wheel
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

      # To publish, add a separate job with PyPI Trusted Publishing (OIDC) rather than a
      # long-lived API token: give that job `permissions: id-token: write`, configure the
      # publisher on PyPI, and run `uv publish` with no credentials in the workflow.
      #
      # publish:
      #   needs: build
      #   runs-on: ubuntu-latest
      #   environment: pypi
      #   permissions:
      #     id-token: write
      #   steps:
      #     - uses: actions/download-artifact@v4
      #       with: { name: dist, path: dist }
      #     - uses: astral-sh/setup-uv@v7
      #     - run: uv publish
