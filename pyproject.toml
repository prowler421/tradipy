[project]
name = "tradipy"
version = "0.0.1"
description = "Ross Cameron momentum trading system — Phase 1 invariant fixtures"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradipy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "spec: asserts a rule stated normatively in docs/PRD.md",
    "boundary: asserts behaviour at a filter's own limit, not at an illustrative value",
    "polarity: asserts a rounding direction follows from constraint polarity (PRD §20.13)",
]
